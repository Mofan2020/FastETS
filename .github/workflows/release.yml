name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing tag to build and publish"
        required: true
        type: string

permissions:
  contents: write

jobs:
  # ---- gate: the automated tests must pass before anything is published ----
  test:
    name: test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python: ["3.11"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip
      - name: Install dependencies
        env:
          PYTHONIOENCODING: utf-8
          PYTHONUTF8: "1"
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: Build the Speex helper
        shell: bash
        run: |
          set -euo pipefail
          if [ "$RUNNER_OS" = "Windows" ]; then
            for candidate in "C:/ProgramData/mingw64/mingw64/bin/gcc.exe" "C:/msys64/mingw64/bin/gcc.exe"; do
              if [ -f "$candidate" ]; then export CC="$candidate"; break; fi
            done
            if [ -z "${CC:-}" ]; then
              choco install mingw -y --no-progress
              export PATH="$PATH:C:/ProgramData/mingw64/mingw64/bin"
              export CC=gcc
            fi
          fi
          ./packaging/native/build_speex.sh

      - name: Self test
        run: python tests/selftest.py

  build:
    name: build (${{ matrix.name }})
    needs: test
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: macOS (Apple Silicon)
            os: macos-latest
            python: "3.11"
            artifact: FastETS-macOS-arm64
          - name: Windows (x64)
            os: windows-latest
            python: "3.11"
            artifact: FastETS-Windows-x64
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip

      - name: Install build dependencies
        env:
          PYTHONIOENCODING: utf-8
          PYTHONUTF8: "1"
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pyinstaller

      - name: Build the Speex helper
        shell: bash
        run: |
          set -euo pipefail
          if [ "$RUNNER_OS" = "Windows" ]; then
            for candidate in "C:/ProgramData/mingw64/mingw64/bin/gcc.exe" "C:/msys64/mingw64/bin/gcc.exe"; do
              if [ -f "$candidate" ]; then export CC="$candidate"; break; fi
            done
            if [ -z "${CC:-}" ]; then
              choco install mingw -y --no-progress
              export PATH="$PATH:C:/ProgramData/mingw64/mingw64/bin"
              export CC=gcc
            fi
          fi
          ./packaging/native/build_speex.sh

      - name: Build (PyInstaller)
        run: pyinstaller --noconfirm --clean packaging/FastETS.spec

      - name: Package macOS
        if: runner.os == 'macOS'
        run: |
          set -euo pipefail
          rm -rf dist-pkg
          mkdir -p dist-pkg
          if [ -d "dist/FastETS.app" ]; then
            cp -R "dist/FastETS.app" "dist-pkg/"
            ( cd dist-pkg && zip -r "${{ matrix.artifact }}.zip" "FastETS.app" -x '*.DS_Store' )
          else
            ( cd dist && zip -r "../dist-pkg/${{ matrix.artifact }}.zip" "FastETS" )
          fi
          ls -la dist-pkg

      - name: Package Windows
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          if (Test-Path dist-pkg) { Remove-Item -Recurse -Force dist-pkg }
          New-Item -ItemType Directory -Force -Path dist-pkg | Out-Null
          Compress-Archive -Path dist/FastETS/* -DestinationPath "dist-pkg/${{ matrix.artifact }}.zip"
          Get-ChildItem dist-pkg | Format-Table Name, Length

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: dist-pkg/${{ matrix.artifact }}.zip
          if-no-files-found: error
          retention-days: 30

  # macOS Intel is not built on CI: GitHub retired the Intel runner images.
  # Intel users build locally with:  ARCH=x86_64 ./packaging/build_macos.sh
  build-macos-intel:
    name: build (macOS Intel, optional)
    needs: test
    runs-on: macos-15-intel
    timeout-minutes: 45
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install build dependencies
        env:
          PYTHONIOENCODING: utf-8
          PYTHONUTF8: "1"
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pyinstaller
      - name: Build the Speex helper
        shell: bash
        run: |
          set -euo pipefail
          if [ "$RUNNER_OS" = "Windows" ]; then
            for candidate in "C:/ProgramData/mingw64/mingw64/bin/gcc.exe" "C:/msys64/mingw64/bin/gcc.exe"; do
              if [ -f "$candidate" ]; then export CC="$candidate"; break; fi
            done
            if [ -z "${CC:-}" ]; then
              choco install mingw -y --no-progress
              export PATH="$PATH:C:/ProgramData/mingw64/mingw64/bin"
              export CC=gcc
            fi
          fi
          ./packaging/native/build_speex.sh
      - name: Build (PyInstaller)
        run: pyinstaller --noconfirm --clean packaging/FastETS.spec
      - name: Package
        run: |
          set -euo pipefail
          rm -rf dist-pkg
          mkdir -p dist-pkg
          cp -R dist/FastETS.app dist-pkg/
          ( cd dist-pkg && zip -r "FastETS-macOS-x64.zip" "FastETS.app" -x '*.DS_Store' )
          ls -la dist-pkg
      - uses: actions/upload-artifact@v4
        with:
          name: FastETS-macOS-x64
          path: dist-pkg/FastETS-macOS-x64.zip
          if-no-files-found: warn
          retention-days: 30

  publish:
    name: publish pre-release
    needs: [build, build-macos-intel]
    # Wait for the optional Intel build too, but never let its failure block
    # the release.
    if: always() && needs.build.result == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - name: Collect archives
        run: |
          set -euo pipefail
          rm -rf release-assets
          mkdir -p release-assets
          # Only our own named archives - never PyInstaller internals such as
          # base_library.zip that live inside the bundled application.
          find artifacts -type f -name 'FastETS-*.zip' -exec cp {} release-assets/ \;
          ls -la release-assets
          test -n "$(ls -A release-assets)" || { echo "no archives collected"; exit 1; }

      - name: Publish GitHub pre-release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event.inputs.tag || github.ref_name }}
          name: ${{ github.event.inputs.tag || github.ref_name }}
          prerelease: true
          draft: false
          fail_on_unmatched_files: true
          files: release-assets/*.zip
          body_path: RELEASE_NOTES.md
