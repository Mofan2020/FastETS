name: CI

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python: ["3.11"]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Import check
        run: python -c "import fastets, fastets.ui.app, fastets.core.completer, fastets.voice; print('imports ok')"

      - name: Self test
        run: python tests/selftest.py

      - name: UI assets present
        run: python -c "import pathlib,sys; p=pathlib.Path('fastets/ui/web'); sys.exit(0 if (p/'index.html').exists() and (p/'app.js').exists() and (p/'style.css').exists() else 1)"

  lint:
    name: syntax check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Compile all sources
        run: python -m compileall -q fastets tests run.py
