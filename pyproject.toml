[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "fastets"
version = "1.0.0"
description = "FastETS - automated homework assistant for the iFlytek E听说 (ets100) platform"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [{ name = "FastETS contributors" }]
keywords = ["ets100", "e听说", "homework", "tts", "voice-clone", "pywebview"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: X11 Applications :: Qt",
    "Intended Audience :: Education",
    "License :: OSI Approved :: MIT License",
    "Operating System :: MacOS :: MacOS X",
    "Operating System :: Microsoft :: Windows",
    "Programming Language :: Python :: 3",
    "Topic :: Education",
]
dependencies = [
    "requests>=2.31",
    "pywebview>=4.4",
    "pyzipper>=0.3.6",
    "imageio-ffmpeg>=0.4.9",
]

[project.optional-dependencies]
macos = ["pywebview[qt]"]
dev = ["pytest>=7.4", "pyinstaller>=6.3"]

[project.urls]
Homepage = "https://github.com/Mofan2020/FastETS"
Repository = "https://github.com/Mofan2020/FastETS"

[project.scripts]
fastets = "fastets.__main__:main"

[tool.setuptools.packages.find]
include = ["fastets*"]

[tool.setuptools.package-data]
fastets = ["ui/web/*"]
